<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Calculadora de Materiales</title>

    <link rel="stylesheet" href="css/estilos.css">
</head>

<body>

<header>
    <h1>Climas y Materiales</h1>
    <p>Calculadora de precios</p>
</header>

<main>

    <section>

        <h2>Calcular precio</h2>

        <label for="producto">
            Producto:
        </label>

        <select id="producto">

            <option value="cable12">
                Cable calibre 12
            </option>

            <option value="cable10">
                Cable calibre 10
            </option>

            <option value="cable14">
                Cable calibre 14
            </option>

            <option value="cobre14">
                Tubería de cobre 1/4
            </option>

            <option value="cobre38">
                Tubería de cobre 3/8
            </option>

            <option value="capacitor">
                Capacitor 35+5 µF
            </option>

            <option value="cinta">
                Cinta aislante
            </option>

            <option value="manguera">
                Manguera de desagüe
            </option>

        </select>


        <label for="cantidad">
            Cantidad:
        </label>

        <input
            type="number"
            id="cantidad"
            value="1"
            min="1"
            step="1"
        >


        <div class="informacion">

            <p id="precioUnitario">
                Precio unitario: ---
            </p>

            <h3 id="resultado">
                Presiona "Calcular precio"
            </h3>

        </div>


        <button onclick="calcularPrecio()">
            Calcular precio
        </button>


        <button onclick="agregarAlCarrito()">
            Agregar a cotización
        </button>


        <hr>


        <h2>Cotización</h2>


        <div class="tabla-contenedor">

            <table>

                <thead>

                    <tr>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Cantidad</th>
                        <th>Total</th>
                        <th>Acción</th>
                    </tr>

                </thead>

                <tbody id="tablaCarrito">
                </tbody>

            </table>

        </div>


        <h3 id="totalCarrito">
            Total cotización: $0.00 MXN
        </h3>

        <button
            class="boton-limpiar"
            onclick="limpiarCotizacion()"
        >
            Limpiar cotización
        </button>

    </section>

</main>


<script src="js/app.js"></script>

</body>

</html>
